name: Unsupported / untested Blade
description: You ran this on a Razer laptop that isn't catalogued. Report what happened so it can get a real descriptor.
title: "[model] Razer Blade <model/year>, PID 0x____"
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        This project is maintained by one person with one laptop (a Blade 16 2023). Everything else
        runs on a *generic* profile, so your report is the only way another model becomes properly
        supported.

        Partial reports are useful. If a section doesn't apply,
        say so rather than guessing: a guessed fan ceiling is worse than a blank one.
  - type: input
    id: model
    attributes:
      label: Model and year
      description: As printed/marketed, e.g. "Razer Blade 14 (2024)".
    validations:
      required: true
  - type: input
    id: sku
    attributes:
      label: SKU
      description: The RZ09-… string, usually on the underside label or in `msinfo32`.
      placeholder: RZ09-0483
    validations:
      required: false
  - type: textarea
    id: probe
    attributes:
      label: Attach `probe.json`
      description: |
        Run `razer-cli probe --out probe.json` (from release 0.9.7 or later) and drag the file
        into this box; it's too long to paste. It only reads settings and takes a few seconds. It
        holds the USB product ID and the model number (SKU); it reads no serial number. If it
        fails, paste the error.
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What actually worked
      description: Only tick what you personally observed working on the hardware.
      options:
        - label: Performance modes (Balanced / Silent / Performance / …) change fan noise or behavior
        - label: Manual fan RPM
        - label: Keyboard brightness
        - label: Keyboard lighting effects (Spectrum / Wave / Breathing / Off)
        - label: Logo lighting
        - label: Charge limit (battery care)
        - label: The Fn media keys still work while the tray is running
  - type: textarea
    id: fan_range
    attributes:
      label: Fan range, if you measured it
      description: |
        Only if you actually tested it. Put the fan in Manual first: run
        `razer-cli auto perf mode balanced`, then `razer-cli auto fan manual`, and check that
        `razer-cli auto info` shows `Fan: Manual`. Up to 0.9.6, `auto fan rpm` alone does not change the mode,
        and other perf modes can hold the fan above the set point. Then, at idle, set each RPM with
        `razer-cli auto fan rpm <N>` and read `fan_actual_rpm` from `razer-cli auto json` every 15 s
        until it stops changing, since the fans ramp slowly. The useful numbers are the lowest
        setpoint that changes anything and the highest the EC will honor. **Leave blank if you're
        unsure**: a blank is better than a guess, since this value goes straight into the device
        table.
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from the log
      description: "`%LOCALAPPDATA%\\razer-tray\\razer-tray.log`. Startup lines and anything with WARN/ERROR."
      render: text
    validations:
      required: false
