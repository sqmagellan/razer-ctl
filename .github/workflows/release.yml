name: release

# Tag-driven releases. Push a tag like `v0.9.2` and this builds the two shipped
# binaries with the MSVC toolchain -- the same configuration CI proves and the same
# one used locally -- and attaches them to a draft GitHub release.
#
# Deliberately a DRAFT: the release notes and the "which model was this actually
# tested on" caveat are written by a human before anyone downloads a binary that
# talks to their laptop's embedded controller.
#
# The gate runs FIRST and the build depends on it, so a tag can never produce
# artifacts from a tree that fails tests, clippy, or fmt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev libxdo-dev librust-atk-dev libgtk-3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -Dwarnings
      - name: Tests
        run: cargo test -p librazer --verbose

  build:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The tray crate is Windows-only, so its tests cannot run on the Linux gate.
      # This is the only place in CI they execute at all.
      - name: Tray tests
        run: cargo test --release --target x86_64-pc-windows-msvc -p razer-tray

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/razer-tray.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/razer-cli.exe dist/
          # Publish checksums: these binaries are unsigned for now, so a hash the user
          # can compare is the only integrity check available to them.
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: razer-ctl-windows-x86_64
          path: dist/

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/razer-tray.exe
            dist/razer-cli.exe
            dist/SHA256SUMS.txt
          body: |
            Unsigned Windows x86_64 binaries. Verify against `SHA256SUMS.txt`.

            Windows SmartScreen will warn on first run: these binaries are not code-signed
            yet. Check the hash if that matters to you.

            **Tested on one model only** — see the Device support section of the README for
            what to expect on other Blades, and please file an "unsupported model" issue if
            you try one.
