name: release

# Tag-driven releases. Push a tag like `v0.9.2` and this builds the two shipped
# binaries with the MSVC toolchain -- the same configuration CI proves and the same
# one used locally -- and attaches them to a draft GitHub release.
#
# Deliberately a DRAFT: the release notes and the "which model was this actually
# tested on" caveat are written by a human before anyone downloads a binary that
# talks to their laptop's embedded controller.
#
# The gate runs FIRST and the build depends on it, so a tag can never produce
# artifacts from a tree that fails tests, clippy, or fmt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the build job, which attests and publishes, gets more.
# These used to be workflow-wide, so the gate job (and every action it runs) could also
# mint the OIDC token that attests a release binary. Actions are pinned to commit SHAs
# and cargo runs `--locked`; see the note in ci.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No librust-atk-dev: it no longer installs on ubuntu-latest and was never the
      # right package (a Rust crate source, not C headers). libgtk-3-dev brings the
      # real ATK development files with it. See the note in ci.yml.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev libxdo-dev libgtk-3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -Dwarnings
      - name: Tests
        run: cargo test --locked -p librazer --verbose

  build:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
      # Required by actions/attest-build-provenance: id-token to obtain the OIDC token
      # that proves *this* workflow run produced the files, attestations to store the
      # signed statement.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag that disagrees with the crate version would publish a razer-tray whose
      # About box reports a different version than its release page.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # Through env, not pasted into the script: a ref name is data, not code.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path razer-tray/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG != razer-tray version v$v" }

      # The tray and CLI crates don't build on the Linux gate's test step, so their
      # tests run here.
      - name: Tray and CLI tests
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p razer-tray -p razer-cli

      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/razer-tray.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/razer-cli.exe dist/
          # Publish checksums: these binaries are unsigned for now, so a hash the user
          # can compare is the only integrity check available to them.
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Sigstore-backed build provenance. This is NOT code signing and does not stop
      # SmartScreen warning about an unsigned binary -- it is the other half of the
      # trust problem. A published SHA-256 only proves a download wasn't corrupted; it
      # says nothing about where the bytes came from, and it is worthless if an
      # attacker can edit the release page that hosts both file and hash. An
      # attestation binds each .exe to this repository, this workflow, and this commit,
      # verifiable by anyone with:
      #
      #   gh attestation verify razer-tray.exe --repo sqmagellan/razer-ctl \
      #     --source-ref refs/tags/vX.Y.Z \
      #     --signer-workflow sqmagellan/razer-ctl/.github/workflows/release.yml
      #
      # Both extra flags matter. `--repo` alone accepts anything this workflow ever
      # attested, and `workflow_dispatch` runs it from any branch, so an exe built from
      # an unreviewed branch passed the command these notes used to print.
      #
      # Free, and it needs no certificate authority, so it is worth having whether or
      # not real code signing ever materialises.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: razer-ctl-windows-x86_64
          path: dist/

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        # One line per paragraph: GitHub renders every newline in release notes as a
        # line break, so wrapped lines showed as a narrow column.
        with:
          draft: true
          files: |
            dist/razer-tray.exe
            dist/razer-cli.exe
            dist/SHA256SUMS.txt
          body: |
            Unsigned Windows x86_64 binaries. Verify against `SHA256SUMS.txt`.

            Windows SmartScreen will warn on first run: these binaries are not code-signed yet. Check the hash if that matters to you.

            Every binary also carries a GitHub build-provenance attestation, which proves it was built by this repository's release workflow from this tag:

            ```
            gh attestation verify razer-tray.exe --repo sqmagellan/razer-ctl --source-ref ${{ github.ref }} --signer-workflow sqmagellan/razer-ctl/.github/workflows/release.yml
            ```

            **Tested on one model only.** See the Device support section of the README for what to expect on other Blades, and please file an "unsupported model" issue if you try one.
